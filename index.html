main{position:relative;z-index:1;width:100%;max-width:440px}
@media (min-width:700px){main{max-width:540px}#hint{font-size:112px}.tile b{font-size:34px}.tile small{font-size:14px}input{font-size:32px;width:200px}button{font-size:21px}#msg{font-size:21px}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 20px}
.tile{border-radius:16px;padding:10px 4px;border:3px solid #f7ecd2;box-shadow:0 5px 12px rgba(0,0,0,.35);color:#fff}
.tile small{display:block;font-size:12px;opacity:.9}
.tile b{font-size:26px;line-height:1.2}
.tile:nth-child(odd){transform:rotate(-3deg)}.tile:nth-child(even){transform:rotate(3deg)}
.blue{background:linear-gradient(#1a8cff,#0a58c4)}.red{background:linear-gradient(#ff6a3a,#cc2a0c)}
.purple{background:linear-gradient(#9a5bf5,#5a2bb8)}.green{background:linear-gradient(#2bb84a,#157a30)}
.paper{background:var(--paper);color:var(--ink);border-radius:22px 22px 8px 22px;border-bottom:8px solid var(--paper-edge);padding:18px 14px;box-shadow:0 8px 20px rgba(0,0,0,.4);transform:rotate(-1deg)}
#hint{font-size:86px;font-weight:900;line-height:1}
#range{font-size:15px;margin-top:6px;font-weight:600}
input{width:170px;margin-top:22px;font-size:28px;font-weight:700;text-align:center;padding:10px;border-radius:14px;border:3px solid #f7ecd2;background:#fffaf0;color:#2b2b33;outline:none}
input:focus{border-color:var(--btn)}
button{display:block;margin:14px auto 0;font-size:19px;font-weight:800;border:0;border-radius:14px;padding:13px 40px;background:var(--btn);color:var(--btn-fg);box-shadow:0 5px 0 #c99500;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c99500}
button:disabled{opacity:.4}
#again{display:none;background:#fff}
#msg{min-height:56px;margin-top:18px;font-size:18px;font-weight:800}
</style>
</head>
<body>
<main>
    <div class="tiles">
    <div class="tile blue"><small>Level</small><b id="level">1</b></div>
    <div class="tile red"><small>Score</small><b id="score">0</b></div>
    <div class="tile purple"><small>Best</small><b id="best">0</b></div>
    <div class="tile green"><small>Tries</small><b id="tries">0</b></div>
  </div>
  <div class="paper"><div id="hint">?</div><div id="range"></div></div>
  <input id="guess" type="number" inputmode="numeric" autocomplete="off">
  <button id="go">Guess</button>
  <div id="msg"></div>
  <button id="again">Play again</button>
</main>
<script>
var level=1,score=0,best=0,max,secret,tries;
var $=function(id){return document.getElementById(id)};
try{best=parseInt(localStorage.getItem("ggBest"))||0}catch(e){}

function newRound(){
  max=10*level;
  secret=Math.floor(Math.random()*max)+1;
  tries=Math.ceil(Math.log2(max))+2;
  $("hint").textContent="?";
  refresh();
}
function refresh(){
  $("level").textContent=level;
  $("range").textContent="Guess a number from 1 to "+max;
  $("score").textContent=score;
  $("best").textContent=best;
  $("tries").textContent=tries;
}
function show(t,c){var m=$("msg");m.textContent=t;m.style.color=c?"var(--"+c+")":"var(--msg)"}
function saveBest(){
  if(score>best){best=score;try{localStorage.setItem("ggBest",best)}catch(e){}}
}
function check(){
  var g=parseInt($("guess").value);
  $("guess").value="";
  if(isNaN(g)){show("Please enter a valid number","bad");return}
  if(g<1||g>max){show("Number must be between 1 and "+max,"bad");return}
  tries--;
  if(g===secret){
    var gain=tries*10+level*10;
    score+=gain;saveBest();level++;newRound();
    $("hint").textContent="🎉";
    show("Correct! +"+gain+" points. Level up!","good");
  }else if(tries===0){
    saveBest();refresh();
    $("hint").textContent=secret;
    show("Game over! Final score: "+score,"bad");
    $("guess").disabled=true;$("go").disabled=true;$("again").style.display="block";
  }else{
    refresh();
    $("hint").textContent=g<secret?"⬆":"⬇";
    show(g<secret?"Higher":"Lower");
  }
  if(!$("guess").disabled)$("guess").focus();
}
function restart(){
  level=1;score=0;
  $("guess").disabled=false;$("go").disabled=false;$("again").style.display="none";
  newRound();show("");$("guess").focus();
}
$("go").addEventListener("click",check);
$("again").addEventListener("click",restart);
$("guess").addEventListener("keydown",function(e){if(e.key==="Enter")check()});
newRound();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
</body>
</html>
